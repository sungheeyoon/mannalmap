name: outside

# **바깥이 답을 바꾸는 검사 — 하루 한 번, main 의 verify 밖에서** (ADR 0257)
#
# 운영 의존성 감사(npm 의 advisory DB — 뿌리와 앱)와 앱이 글자로 박은 Maven 좌표(저장소의 답)는 코드가 그대로여도 답이 바뀐다.
# main 의 verify 에 두었을 때 공개 출시 뒤 main 이 붉었던 네 번이 모두 바깥 탓이었고(#1131 · #1147 · #1165 · #1170), 그 붉음이
# 「새 작업보다 먼저」와 배포의 기다림을 함께 걸었다. 그래서 여기서 따로 돌고, 알릴 것이 있으면 `ci-main-red` 가 아닌 제 이슈
# (`ci-outside-red`) 하나에 적는다. 판단은 `scripts/outside-red.mjs` 한 곳에 있다. 감사의 답을 바꾸는 파일을 바꾼 PR 의 `audit` 은
# 그대로 verify 에서 머지를 막는다.
on:
  schedule:
    - cron: '30 20 * * *' # 05:30 KST — verify 의 일정 30분 뒤
  workflow_dispatch:
  # 이 검사를 고친 PR 에서도 한 번 돈다 — 이슈는 안 건드리고 요약에만 찍는다. 필수 검사가 아니라서 `paths` 로 거른다
  # (verify 가 `paths` 를 안 쓰는 까닭은 건너뛴 필수 검사가 머지를 막아서다 — 이 워크플로는 `gate` 에 안 물린다).
  pull_request:
    paths:
      - .github/workflows/outside.yml
      - scripts/outside-red.mjs
      - scripts/audit-app.mjs
      - scripts/mobile-native.mjs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 잰다 — 읽기만 한다. 판정은 출력 `verdict` 로 넘기고, 붉으면 이 job 이 붉어 실행 목록에서도 보인다
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Maven 좌표는 연결되는 모듈의 gradle 에서 읽는다 — 앱의 의존을 깐다. 감사 둘은 잠금 파일만 읽는다. 깔기가 서도 감사는 돈다
      # (Maven 은 「못 물었다」로 붉다)
      - run: npm ci
        id: install
        working-directory: mobile
        continue-on-error: true
      - run: node scripts/outside-red.mjs check
        id: check
      - if: ${{ steps.check.outputs.red == 'true' }}
        run: |
          echo '::error::바깥 검사가 붉다 — 요약을 본다. main 의 일정이면 이슈(ci-outside-red)에 적힌다'
          exit 1

  # 이슈를 쓰는 것은 이 job 하나다 — `issues: write` 를 여기에만 준다. PR 과 main 밖의 손 실행은 쓰지 않는다.
  # 검사 job 이 붉어도(판정은 출력에 있다) · 섰어도(판정 없음 — 「못 받았다」로 적는다) 돈다
  report:
    needs: check
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/outside-red.mjs report
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
